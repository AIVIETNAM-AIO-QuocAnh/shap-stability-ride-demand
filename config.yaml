
meta:
  project: "shap-stability-ride-demand"
  config_version: "0.1.0"          # bump on design changes -> traceable results

seed: 42

# DATA
dataset:
  name: ""
  source: ""                
  openml_version: 1

splits:
  hpo: 
    train_start: "2025-01-22"
    train_end: "2025-06-30"
    valid_start: "2025-07-01"
    valid_end: "2025-07-31"
  f1: 
    train_start: "2025-01-22"
    train_end: "2025-07-31"
    valid_start: "2025-08-01"
    valid_end: "2025-08-31"
  f2: 
    train_start: "2025-01-22"
    train_end: "2025-08-31"
    valid_start: "2025-09-01"
    valid_end: "2025-09-30"
  f3: 
    train_start: "2025-01-22"
    train_end: "2025-09-30"
    valid_start: "2025-10-01"
    valid_end: "2025-10-31"
  f4: 
    train_start: "2025-01-22"
    train_end: "2025-10-31"
    valid_start: "2025-11-01"
    valid_end: "2025-11-30"
  final: 
    train_start: "2025-01-22"
    train_end: "2025-11-30"
    valid_start: "2025-12-01"
    valid_end: "2025-12-31"


# [PATHS] 
paths:
  results: "results/"
# [Pipeline — AI Engineer Pipeline & Model] 

models:
  lightgbm:
    objective: "regression"
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    colsample_bytree: 1.0
    n_jobs: -1

  xgboost:
    objective: "reg:squarederror"
    tree_method: "hist"
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1
    subsample: 1.0
    colsample_bytree: 1.0
    n_jobs: -1

  optuna:
    n_trials: 20

    lightgbm:
      n_estimators: [200, 300, 400, 500, 600]
      learning_rate:
        low: 0.03
        high: 0.10
        log: true
      num_leaves: [15, 23, 31, 47, 63]
      min_child_samples: [20, 40, 60, 80, 100]
      colsample_bytree:
        low: 0.7
        high: 1.0

    xgboost:
      n_estimators: [200, 300, 400, 500, 600]
      learning_rate:
        low: 0.03
        high: 0.10
        log: true
      max_depth: [4, 5, 6, 7, 8]
      min_child_weight: [1, 3, 5, 7, 10]
      subsample:
        low: 0.7
        high: 1.0
      colsample_bytree:
        low: 0.7
        high: 1.0
shap: 
  zone_sample_size: 100
