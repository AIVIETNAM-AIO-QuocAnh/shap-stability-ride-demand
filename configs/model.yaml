seed: 42

paths:
  results: results
  results_hpo: results/hpo
  results_stats: results/stats

models:
  lightgbm:
    objective: regression
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20
    colsample_bytree: 1.0
    n_jobs: -1
  xgboost:
    objective: reg:squarederror
    tree_method: hist
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1
    subsample: 1.0
    colsample_bytree: 1.0
    n_jobs: -1

hpo:
  n_trials: 20
  search_space:
    lightgbm:
      n_estimators: [200, 300, 400, 500, 600]
      learning_rate: {low: 0.03, high: 0.10, log: true}
      num_leaves: [15, 23, 31, 47, 63]
      min_child_samples: [20, 40, 60, 80, 100]
      colsample_bytree: {low: 0.7, high: 1.0}
    xgboost:
      n_estimators: [200, 300, 400, 500, 600]
      learning_rate: {low: 0.03, high: 0.10, log: true}
      max_depth: [4, 5, 6, 7, 8]
      min_child_weight: [1, 3, 5, 7, 10]
      subsample: {low: 0.7, high: 1.0}
      colsample_bytree: {low: 0.7, high: 1.0}

shap:
  zone_sample_size: 100
